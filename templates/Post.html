<!DOCTYPE html>
<html lang="en" xml:lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Post</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Source+Code+Pro:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/post.css' ) }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='Img/Logo-Cuammunity.avif') }}" type="image/x-icon">
    <script src="{{ url_for('static', filename='JS/Post.js' ) }}" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
  </head>

  <body>
    <input type ="hidden" value= "{{post_id}}" id="id_4_data">
    <input type ="hidden" value= "{{profile_data[0]}}" id="id_current_user">
    <div id="Background_Back">
      <div id="Background_Front" cals>

        <header class="glass-panel">
          <div id="Logo_Name">
            <div id="Logo_frame">
              <img src="{{url_for('static',filename='Img/Logo-Cuammunity.avif')}}"alt="Logo" id="Logo">
            </div>
            <span id="Title">Cua-mmunity</span></span>
          </div>
              <!--Quitar la lupa por una imagen-->
              
              <!--Barra de Navegación-->
              <div id="Look-up" class="glass-btn">
                <input id="Text-Lp" type="text"  placeholder="Busca una Comunidad" </input>

                <div id="Look-Icon">
                  <div id="Line_1" class="pointer-events-none">
                  </div>
                  <div id="Ellipse_1" class="pointer-events-none">
                  </div>
                </div>
              
              </div>
              
          </header>
          <section id="main-layout">
       
            
          <section id="Posts" class="glass-panel">
            <div id="Users_Posts">
              <template id="template-4-post">
              <div id="Post" class="glass-card">
                <div id = "Info_post">
                  <div id="First_Line">
                    <div id="Post_User" >
                      <input type="hidden" id="Id_post" >
                      <div id="Post_img_user_frame">
                      <img src="{{ url_for('static', filename='Img/Logo-Cuammunity.avif') }}"  loading="lazy" alt="Logo" id="Post_Img_User">
                    </div>
                    <span id="Post_Name" class="text">Name</span>
                  </div>
                  <div id="Options">
                   
                      <button id="Edit" type="button" onclick="EditContent(this)"><i class="fa-solid fa-pencil" style="color: rgb(255, 255, 255);"></i></button>
                

                      <button id="Delete"type="button" onclick="Preventive(this)"><i class="fa-solid fa-trash" style="color: rgb(255, 255, 255);"></i></button>
                   


                  </div>
                </div>
                <div id="Community-info">
                  <span id ="Community_Name" class="text">Cuammunity</span>
                </div>
            </div>
                <div id="Post_Content">
                  <span id="Content-Text" class="text">
                    Lorem Ipsum&nbsp;is simply dummy text of the printing and typesetting industry. Lorem Ipsum has been the industry's standard dummy text ever since the 1500s, when an unknown printer took a galley of type and scrambled it to make a type specimen book. 
                  </span>

                  <img src="{{url_for('static',filename='Img/Img_Borrador.avif')}}" loading="lazy" alt="image 1" id="Post_Img_Content" >
                </div>
                <div id="Amount-Interactions">
                  <span id="amount-likes"></span>
                  <span id="amount-comments"></span>

                </div>

                <div id="Icons">
                              
                  <div id="Like" class="glass-btn">
                    <input id="toggle-heart" type="checkbox"/>
                    <label for="toggle-heart" aria-label="like">♡</label>
                    <span  class="Icon_text">Me gusta</span>
                  </div>
                </div>
            </div>
            

            <div id="Comments" class="glass-card">
            <template id="TemplateComments">
              <div id = "Comment" class="glass-btn">
                <div id="User_frame_comment">
                  <img src="{{profile_data[9]}}" alt="user-comment-logo" id="logo_comment"  loading="lazy" class="User_pic" >
                </div>
              <div id = "CommentData" class="glass-card">
              <span id="userName_comment"></span>
              <span name="comment" id="comment_of_user"  type="text" ></span>
              </div>
            </div>
           </template>
          </div>
          
            <div id="Comment_Section" class="glass-btn">
              <div id="User_frame_comment">
                <img src="{{profile_data[9]}}" alt="image 1"  loading="lazy" class="User_pic" >
              </div>
              <form id="Comment-Text" method="POST" action="/comentar">
                <textarea name="comment" id="comment_holder"  type="text" placeholder="Add a Coment" ></textarea>
                 <button class="glass-btn" id="add_comment" type="submit" >Send</button>
              </form>
            </div>
       
            </div>
          </template>
            </section>
          </section>
      </div>

          
      <menu id="Menu" class="glass-panel">
            
        <a href="{{url_for('main', id=profile_data[0])}}" id="Home" class="glass-btn">

        </a>
        
        <a href= "bai" id="Perfil" class="glass-btn">

  </div>
  <div id="PopCard">
      <div id= "PopCard_Content"> 
        <span id="msg"></span>
        <div id="Pop_Text">
            <label id="CommunityN_Title"></label>
            <textarea name="new_txt_post"id="Pop_Text_Area" class="text" placeholder="-"></textarea>
        
             <div class="upload-container">
                    <label  id=user-label class="text">Logo de tu Comunidad</label>
                    <label  id="btnfake">
                        <i class="fas fa-cloud-upload-alt"></i> Seleccionar Foto
                      </label>
                    <input name = "community_logo"  type="file" id="community_logo_input" value="Foto de perfil" required>
                    <span id="fakefile">Ningún archivo seleccionado</span>
              </div>

              <div class="upload-container">
                    <label  id=user-label class="text">Fondo para tu Comunidad</label>
                    <label  id="btnfake_bg">
                        <i class="fas fa-cloud-upload-alt"></i> Seleccionar Foto
                      </label>
                    <input name = "community_logo"  type="file" id="community_background_input" value="Foto de perfil" required>
                    <span id="fakefile_background">Ningún archivo seleccionado</span>
              </div>
          </div>
        <div id=Btns>
          <a id= PopBotton href="#">
          <button id= "pop_btn" onclick="ClosePop()">Entendido</button>
          </a>
        
         <button id= "pop_btn_2" type="submit"></button>
      </div>
      </div>
    </div>
